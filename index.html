<!DOCTYPE html>
<html>

<head>

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>JARVIS</title>

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  padding: 20px;

  font-family:
    Arial,
    sans-serif;

  background:
    #050505;

  color:
    white;

  text-align:
    center;
}

h1 {

  margin-top:
    15px;

  margin-bottom:
    5px;

  font-size:
    42px;
}

.subtitle {

  color:
    #999;

  margin-bottom:
    25px;
}

.command-box {

  width:
    100%;

  max-width:
    500px;

  padding:
    16px;

  font-size:
    18px;

  border:
    1px solid #555;

  border-radius:
    12px;

  background:
    #111;

  color:
    white;

  outline:
    none;
}

button {

  width:
    100%;

  max-width:
    500px;

  padding:
    15px;

  margin-top:
    10px;

  border:
    none;

  border-radius:
    12px;

  font-size:
    17px;

  font-weight:
    bold;

  cursor:
    pointer;
}

.send {

  background:
    #00c853;

  color:
    white;
}

.send:active {

  transform:
    scale(0.98);
}

#result {

  margin:
    18px auto;

  padding:
    15px;

  max-width:
    500px;

  background:
    #111;

  border-radius:
    10px;

  min-height:
    50px;
}

.voice-info {

  color:
    #aaa;

  line-height:
    1.6;

  margin:
    15px;
}

hr {

  border:
    0;

  border-top:
    1px solid #333;

  margin:
    30px 0;
}

h2 {

  margin-bottom:
    15px;
}

.grid {

  display:
    grid;

  grid-template-columns:
    1fr 1fr;

  gap:
    10px;

  max-width:
    500px;

  margin:
    auto;
}

.grid button {

  margin:
    0;

  font-size:
    15px;
}

.on {

  background:
    #00a152;

  color:
    white;
}

.off {

  background:
    #c62828;

  color:
    white;
}

.all {

  grid-column:
    span 2;

  background:
    #1565c0;

  color:
    white;
}

.footer {

  margin-top:
    30px;

  color:
    #555;

  font-size:
    13px;
}

</style>

</head>


<body>

<h1>🤖 JARVIS</h1>

<div class="subtitle">
ESP32 Voice & Light Controller
</div>


<input
  id="command"
  class="command-box"
  type="text"
  placeholder="Type or 🎤 speak command"
  autocomplete="off"
  autocorrect="off"
  autocapitalize="sentences"
  spellcheck="false"
>


<button
  class="send"
  onclick="sendTypedCommand()">

📡 SEND COMMAND

</button>


<div id="result">

Ready

</div>


<div class="voice-info">

🎤 Tap the microphone on your phone keyboard.

<br>

Say:

<b>LED 1 ON</b>

<br>

<b>LED 3 OFF</b>

<br>

<b>ALL ON</b>

<br>

<b>ALL OFF</b>

</div>


<hr>


<h2>⚡ Quick Control</h2>


<div class="grid">

<button
  class="all"
  onclick="sendCommand('ALL ON')">

ALL ON

</button>


<button
  class="all"
  onclick="sendCommand('ALL OFF')">

ALL OFF

</button>


<button
  class="on"
  onclick="sendCommand('LED 1 ON')">

LED 1 ON

</button>


<button
  class="off"
  onclick="sendCommand('LED 1 OFF')">

LED 1 OFF

</button>


<button
  class="on"
  onclick="sendCommand('LED 2 ON')">

LED 2 ON

</button>


<button
  class="off"
  onclick="sendCommand('LED 2 OFF')">

LED 2 OFF

</button>


<button
  class="on"
  onclick="sendCommand('LED 3 ON')">

LED 3 ON

</button>


<button
  class="off"
  onclick="sendCommand('LED 3 OFF')">

LED 3 OFF

</button>


<button
  class="on"
  onclick="sendCommand('LED 4 ON')">

LED 4 ON

</button>


<button
  class="off"
  onclick="sendCommand('LED 4 OFF')">

LED 4 OFF

</button>


<button
  class="on"
  onclick="sendCommand('LED 5 ON')">

LED 5 ON

</button>


<button
  class="off"
  onclick="sendCommand('LED 5 OFF')">

LED 5 OFF

</button>

</div>


<div class="footer">

JARVIS v1.0 • ESP32

</div>


<script>


// =====================================================
// GOOGLE APPS SCRIPT URL
// =====================================================

const SCRIPT_URL =
  "https://script.google.com/macros/s/"
  + "AKfycbyNSzanFGieKBDeielaUpXfAW7GPYX2hGZXD1j4DPPALX9fC5Ey8qQMsUXGFd7egMJILA"
  + "/exec";


// =====================================================
// SEND TEXT COMMAND
// =====================================================

function sendTypedCommand() {

  const box =
    document.getElementById(
      "command"
    );


  const command =
    box.value.trim();


  if (
    command === ""
  ) {

    document.getElementById(
      "result"
    ).innerHTML =
      "⚠️ Please enter a command";

    return;
  }


  sendCommand(
    command
  );


  box.value = "";
}


// =====================================================
// SEND COMMAND
// =====================================================

function sendCommand(
  command
) {

  command =
    command.trim();


  if (
    command === ""
  ) return;


  const result =
    document.getElementById(
      "result"
    );


  result.innerHTML =
    "📡 Sending: <b>" +
    escapeHTML(command) +
    "</b>";


  const url =
    SCRIPT_URL +
    "?action=send&command=" +
    encodeURIComponent(
      command
    );


  fetch(url)

    .then(
      response => {

        if (
          !response.ok
        ) {

          throw new Error(
            "HTTP " +
            response.status
          );
        }


        return response.json();
      }
    )

    .then(
      data => {

        if (
          data.success
        ) {

          result.innerHTML =
            "✅ Command sent: <b>" +
            escapeHTML(
              data.command
            ) +
            "</b>";

        }
        else {

          result.innerHTML =
            "❌ " +
            escapeHTML(
              data.message ||
              "Command failed"
            );
        }
      }
    )

    .catch(
      error => {

        console.error(
          error
        );

        result.innerHTML =
          "❌ Unable to contact JARVIS server";
      }
    );
}


// =====================================================
// SECURITY
// =====================================================

function escapeHTML(
  text
) {

  return text
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );
}


// =====================================================
// ENTER KEY
// =====================================================

document
  .getElementById(
    "command"
  )
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter"
      ) {

        sendTypedCommand();
      }
    }
  );

</script>

</body>

</html>
