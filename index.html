<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>JARVIS</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #080b12;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      color: #00eaff;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #888;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 15px;
      border-radius: 10px;
      border: 1px solid #333;
      background: #111722;
      color: white;
      font-size: 17px;
      outline: none;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 13px;
      margin: 5px;
      font-size: 15px;
      cursor: pointer;
    }

    .send {
      width: 100%;
      background: #00bcd4;
      color: white;
      font-size: 18px;
      margin-top: 10px;
    }

    .all {
      width: 44%;
      color: white;
    }

    .on {
      background: #159447;
    }

    .off {
      background: #b52b2b;
    }

    .led {
      width: 44%;
      background: #202938;
      color: white;
    }

    .weather {
      width: 92%;
      background: #7357d8;
      color: white;
      font-size: 17px;
      margin-top: 15px;
    }

    #status {
      margin-top: 20px;
      padding: 12px;
      background: #111722;
      border-radius: 10px;
      color: #aaa;
      min-height: 45px;
    }

    .section {
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px solid #222;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>JARVIS</h1>

  <div class="subtitle">
    Smart ESP32 Controller
  </div>


  <input
    id="command"
    type="text"
    placeholder="Type or 🎤 speak command"
  >


  <button
    class="send"
    onclick="sendCommand()">
    SEND
  </button>


  <div class="section">

    <button
      class="all on"
      onclick="sendQuick('all on')">
      ALL ON
    </button>

    <button
      class="all off"
      onclick="sendQuick('all off')">
      ALL OFF
    </button>

  </div>


  <div class="section">

    <button
      class="led"
      onclick="sendQuick('led 1 on')">
      LED 1 ON
    </button>

    <button
      class="led"
      onclick="sendQuick('led 1 off')">
      LED 1 OFF
    </button>


    <button
      class="led"
      onclick="sendQuick('led 2 on')">
      LED 2 ON
    </button>

    <button
      class="led"
      onclick="sendQuick('led 2 off')">
      LED 2 OFF
    </button>


    <button
      class="led"
      onclick="sendQuick('led 3 on')">
      LED 3 ON
    </button>

    <button
      class="led"
      onclick="sendQuick('led 3 off')">
      LED 3 OFF
    </button>


    <button
      class="led"
      onclick="sendQuick('led 4 on')">
      LED 4 ON
    </button>

    <button
      class="led"
      onclick="sendQuick('led 4 off')">
      LED 4 OFF
    </button>


    <button
      class="led"
      onclick="sendQuick('led 5 on')">
      LED 5 ON
    </button>

    <button
      class="led"
      onclick="sendQuick('led 5 off')">
      LED 5 OFF
    </button>

  </div>


  <div class="section">

    <button
      class="weather"
      onclick="getWeather()">
      🌤️ WHAT'S THE WEATHER?
    </button>

  </div>


  <div id="status">
    JARVIS READY
  </div>

</div>


<script>

// =====================================================
// GOOGLE APPS SCRIPT URL
// =====================================================

const SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbwhbhxjQ-SSM_P5U29FiEo4e6K6P3zK7cAhJnSE3FhPanhYH-3ItUnImhZV7LMZxtlZCQ/exec";


// =====================================================
// STATUS
// =====================================================

function showStatus(text) {

  document.getElementById("status").innerText =
    text;

}


// =====================================================
// SEND NORMAL COMMAND
// =====================================================

function sendCommand() {

  const input =
    document.getElementById("command");

  const command =
    input.value.trim();


  if (!command) {

    showStatus(
      "Please enter a command"
    );

    return;
  }


  // =================================================
  // WEATHER VOICE / TEXT DETECTION
  // =================================================

  const lower =
    command.toLowerCase().trim();


  const weatherRequest =
    lower === "weather" ||
    lower === "what is the weather" ||
    lower === "what's the weather" ||
    lower === "whats the weather" ||
    lower === "tell me the weather" ||
    lower === "how is the weather" ||
    lower === "how's the weather" ||
    lower === "how is the weather today" ||
    lower === "what is the weather today" ||
    lower === "what's the weather today" ||
    lower.includes("weather today") ||
    lower.includes("weather");


  if (weatherRequest) {

    getWeather();

    return;
  }


  // Normal ESP32 command

  sendToGoogle(command);

}


// =====================================================
// QUICK BUTTON
// =====================================================

function sendQuick(command) {

  sendToGoogle(command);

}


// =====================================================
// SEND NORMAL COMMAND TO GOOGLE
// =====================================================

function sendToGoogle(command) {

  showStatus(
    "Sending: " + command
  );


  const url =
    SCRIPT_URL +
    "?action=send&command=" +
    encodeURIComponent(command);


  fetch(url)

    .then(response => response.json())

    .then(data => {

      if (data.success) {

        showStatus(
          "✅ Command sent: " +
          data.command
        );

      } else {

        showStatus(
          "❌ " +
          (data.message ||
           "Command failed")
        );
      }

    })

    .catch(error => {

      console.error(error);

      showStatus(
        "❌ Connection error"
      );

    });

}


// =====================================================
// WEATHER
// =====================================================

function getWeather() {

  showStatus(
    "📍 Getting your phone location..."
  );


  if (!navigator.geolocation) {

    showStatus(
      "❌ Location is not supported"
    );

    return;
  }


  navigator.geolocation.getCurrentPosition(

    function(position) {

      const lat =
        position.coords.latitude;

      const lon =
        position.coords.longitude;


      console.log(
        "PHONE GPS:",
        lat,
        lon
      );


      showStatus(
        "📍 Location found. Getting weather..."
      );


      const url =
        SCRIPT_URL +
        "?action=weather" +
        "&lat=" +
        encodeURIComponent(lat) +
        "&lon=" +
        encodeURIComponent(lon);


      fetch(url)

        .then(response => {

          if (!response.ok) {
            throw new Error(
              "HTTP " +
              response.status
            );
          }

          return response.json();

        })

        .then(data => {

          if (data.success) {

            showStatus(
              "🌤️ " +
              data.city +
              " • " +
              data.temperature +
              "°C • " +
              data.description +
              " — sent to JARVIS"
            );

          } else {

            showStatus(
              "❌ Weather error: " +
              data.message
            );

          }

        })

        .catch(error => {

          console.error(error);

          showStatus(
            "❌ Weather connection error"
          );

        });

    },


    function(error) {

      console.error(
        "GPS ERROR:",
        error
      );


      if (error.code === 1) {

        showStatus(
          "❌ Location permission denied"
        );

      }

      else if (error.code === 2) {

        showStatus(
          "❌ Location unavailable"
        );

      }

      else if (error.code === 3) {

        showStatus(
          "❌ Location request timed out"
        );

      }

      else {

        showStatus(
          "❌ Could not get phone location"
        );

      }

    },


    {
      enableHighAccuracy: false,
      timeout: 30000,
      maximumAge: 60000
    }

  );

}


// =====================================================
// ENTER KEY
// =====================================================

document
  .getElementById("command")
  .addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Enter") {

        sendCommand();

      }

    }
  );

</script>

</body>
</html>
